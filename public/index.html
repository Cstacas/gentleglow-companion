<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GentleGlow Companion Screen</title>
  <link rel="stylesheet" href="style.css?v=58">
  <!-- Google Fonts for retro/premium style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <!-- Discord SDK (for Option D Activity integration) -->
  <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.0.0/dist/index.global.js"></script>
  <!-- Supabase client script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="icon" type="image/png" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='2' width='12' height='12' fill='%23ff4081'/></svg>">
</head>
<body>
  <div class="tamagotchi-container">
    <!-- Outer Shell of the Tamagotchi Device -->
    <div class="toy-shell">
      <div class="shell-header">✨ GENTLEGLOW ✨</div>
      
      <!-- LCD Screen -->
      <div class="lcd-screen">
        <div class="screen-header">
          <span id="companion-name">Loading...</span>
          <span id="love-points">❤️ 000</span>
        </div>
        
        <!-- Animated Sprite Container -->
        <div class="viewport">
          <!-- Action Overlay Elements -->
          <img class="food-bowl-overlay" id="food-bowl" src="./images/food_bowl.png" alt="Bowl">
          <div class="toy-ball-overlay" id="toy-ball">⚽</div>

          <!-- Plant Container Layers -->
          <div class="plant-layers" id="plant-container" style="display: none;">
            <!-- Action Cutscene Overlays for Plants -->
            <div class="watering-can-overlay" id="watering-can">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
                <!-- Handle on the right -->
                <rect x="24" y="12" width="6" height="10" fill="none" stroke="#ffb74d" stroke-width="2"/>
                <!-- Body in the middle -->
                <rect x="10" y="10" width="14" height="14" fill="#00acc1"/>
                <!-- Spout pointing left -->
                <path d="M10,16 L4,10" stroke="#00acc1" stroke-width="2"/>
                <!-- Sprinkler head (Rose) on left -->
                <rect x="2" y="8" width="3" height="5" fill="#ffb74d"/>
              </svg>
              <div class="water-drops">
                <span class="drop d1">💧</span>
                <span class="drop d2">💧</span>
                <span class="drop d3">💧</span>
              </div>
            </div>
            
            <div class="scissors-overlay" id="scissors">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" class="scissors-svg">
                <path d="M8,12 L24,15 L24,17 L8,15" fill="#b0bec5" class="blade-top"/>
                <path d="M8,20 L24,17 L24,15 L8,17" fill="#90a4ae" class="blade-bottom"/>
                <circle cx="6" cy="11" r="4" fill="none" stroke="#ef5350" stroke-width="2"/>
                <circle cx="6" cy="21" r="4" fill="none" stroke="#ef5350" stroke-width="2"/>
                <rect x="10" y="15" width="2" height="2" fill="#37474f"/>
              </svg>
            </div>
            
            <div class="plant-chat-overlay" id="plant-chat-bubble">
              <div class="chat-bubble-content">
                <span class="chat-text">🌱✨</span>
              </div>
            </div>

            <div class="plant-decor-layer" id="plant-decor"></div>
            <div class="plant-sprite-layer" id="plant-sprite"></div>
            <div class="plant-pot-layer" id="plant-pot"></div>
          </div>

          <div class="sprite-wrapper" id="sprite-wrapper" style="display: none;">
            <div class="sleep-zzz-overlay" id="sleep-zzz">
              <span>z</span><span>Z</span><span>z</span>
            </div>
            <img class="pet-hand-overlay" id="pet-hand" src="./images/pet_hand.png" alt="Hand">
            <div class="pet-character-container" id="pet-character-container">
              <div class="accessory-overlay" id="equipped-accessory"></div>
              <!-- Interactive Sprite Sheet Frame -->
              <div class="pet-sprite-sheet idle" id="companion-sprite"></div>
            </div>
          </div>
        </div>
        
        <!-- Status Meters -->
        <div class="status-grid">
          <div class="status-row">
            <span class="status-label">STATUS</span>
            <div class="status-bar"><div class="fill" id="status-bar-love" style="width: 50%;"></div></div>
          </div>
          <div class="status-row">
            <span class="status-label">MOOD</span>
            <span id="mood-text">Peaceful 🧘</span>
          </div>
        </div>
      </div>
      
      <!-- Physical Buttons -->
      <div class="buttons-row">
        <button class="toy-button" id="btn-feed">FEED</button>
        <button class="toy-button" id="btn-play">PLAY</button>
        <button class="toy-button" id="btn-pet">PET</button>
      </div>
      
      <div class="shell-footer">
        <span>♥ Companion Screen ♥</span>
        <button class="theme-select-btn" id="btn-theme" title="Change Shell Color">🎨 Color</button>
      </div>
    </div>
  </div>
  
  <script src="app.js?v=58"></script>
</body>
</html>
